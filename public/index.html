<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerLine · money you can prove</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="auth" class="auth">
  <div class="hero">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="9" width="32" height="3" rx="1.5"/><rect x="4" y="18.5" width="32" height="3" rx="1.5"/><rect x="4" y="28" width="20" height="3" rx="1.5"/><circle cx="31" cy="29.5" r="4.5"/></svg>
    <h1>LedgerLine</h1>
    <p class="tag">Money movement with a ledger you can prove.</p>
    <ul class="pts"><li>Books always balance</li><li>Same request never pays twice</li><li>History can’t be quietly edited</li></ul>
  </div>
  <form class="panel" id="loginForm" autocomplete="off">
    <h2>Sign in</h2>
    <label>Email<input id="email" type="email" required></label>
    <label>Password<input id="pw" type="password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="hint">Demo accounts — click to fill (password <code>Passw0rd!demo</code>)</p>
    <div class="chips" id="demo"></div>
  </form>
</section>

<div id="shell" hidden>
  <header class="top">
    <div class="brand"><svg class="mark sm" viewBox="0 0 40 40"><rect x="4" y="9" width="32" height="3" rx="1.5"/><rect x="4" y="18.5" width="32" height="3" rx="1.5"/><rect x="4" y="28" width="20" height="3" rx="1.5"/><circle cx="31" cy="29.5" r="4.5"/></svg>LedgerLine</div>
    <div class="who"><span id="whoEmail"></span><span id="whoRole" class="pill"></span><button class="btn ghost sm" id="theme" title="Toggle theme">◐</button><button class="btn ghost sm" id="out">Sign out</button></div>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script></body></html>
